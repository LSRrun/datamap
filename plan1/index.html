<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="部门数据地图粒子关系网络 Demo，可按主题域、上线状态和入湖状态浏览数据表。"
    />
    <meta name="theme-color" content="#f4f7fb" />
    <title>东鹏数据地图</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%236d5dfc'/%3E%3Cstop offset='1' stop-color='%2308b8d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='11' cy='12' r='3' fill='white'/%3E%3Ccircle cx='21' cy='10' r='2.5' fill='white' fill-opacity='.85'/%3E%3Ccircle cx='19' cy='22' r='3.5' fill='white' fill-opacity='.9'/%3E%3Cpath d='M13.5 12l5-1M12.5 14.5l4.5 5M21 12.5l-1 6' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主题域导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span>
            <strong>东鹏数据地图</strong>
            <small>Data Asset Explorer</small>
          </span>
        </div>

        <div class="sidebar-heading">
          <span>主题域</span>
          <span id="domainTotal">0</span>
        </div>
        <nav id="domainNav" class="domain-nav"></nav>

        <div class="sidebar-note">
          <span class="pulse-dot" aria-hidden="true"></span>
          <div>
            <strong>数据目录已同步</strong>
            <small>来源：数据模型全.xlsx</small>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="page-title">
            <h1>数据资产全景</h1>
            <p>探索主题域、业务对象与数据表之间的关联</p>
          </div>

          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.6-3.6"></path>
            </svg>
            <label class="sr-only" for="searchInput">搜索数据表</label>
            <input
              id="searchInput"
              type="search"
              placeholder="搜索中文表名、英文表名或业务对象"
              autocomplete="off"
            />
            <kbd>⌘ K</kbd>
          </div>

          <button id="overviewBtn" class="overview-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 19V9"></path><path d="M10 19V5"></path><path d="M16 19v-7"></path><path d="M22 19V3"></path>
            </svg>
            数据概览
          </button>
        </header>

        <section class="stats-row" aria-label="数据概览">
          <article class="stat-card">
            <span class="stat-icon purple" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3Z"></path><path d="M4 7v5c0 1.7 3.6 3 8 3s8-1.3 8-3V7"></path><path d="M4 12v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"></path></svg>
            </span>
            <span><small>数据表</small><strong id="tableCount">0</strong></span>
          </article>
          <article class="stat-card">
            <span class="stat-icon cyan" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><circle cx="5" cy="6" r="2"></circle><circle cx="19" cy="6" r="2"></circle><circle cx="5" cy="18" r="2"></circle><circle cx="19" cy="18" r="2"></circle><path d="m7 7 3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"></path></svg>
            </span>
            <span><small>主题域</small><strong id="domainCount">0</strong></span>
          </article>
          <article class="stat-card">
            <span class="stat-icon green" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16.5 8.5"></path></svg>
            </span>
            <span><small>已线上化</small><strong id="onlineCount">0</strong></span>
          </article>
          <article class="stat-card">
            <span class="stat-icon orange" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3Z"></path><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"></path><path d="M8.5 13.5 11 16l4.5-5"></path></svg>
            </span>
            <span><small>已入湖</small><strong id="lakeCount">0</strong></span>
          </article>
        </section>

        <section class="map-panel">
          <div class="map-toolbar">
            <div class="filter-tabs" role="group" aria-label="状态筛选">
              <button class="filter-tab active" type="button" data-filter="all">全部数据</button>
              <button class="filter-tab" type="button" data-filter="online">已线上化</button>
              <button class="filter-tab" type="button" data-filter="lake">已入湖</button>
            </div>
            <div class="view-actions">
              <span id="visibleSummary">显示全部数据表</span>
              <button id="zoomOutBtn" type="button" aria-label="缩小">−</button>
              <button id="resetViewBtn" type="button" aria-label="重置视图">◎</button>
              <button id="zoomInBtn" type="button" aria-label="放大">＋</button>
            </div>
          </div>

          <div id="canvasStage" class="canvas-stage">
            <canvas id="networkCanvas" aria-label="数据表主题域粒子关系网络"></canvas>
            <div id="canvasTooltip" class="canvas-tooltip" role="tooltip" hidden></div>
            <div class="canvas-hint">
              <span>拖动画布探索</span>
              <span>滚轮缩放</span>
              <span>点击节点查看详情</span>
            </div>
          </div>

          <aside id="detailPanel" class="detail-panel" aria-live="polite">
            <button id="closeDetailBtn" class="detail-close" type="button" aria-label="关闭详情">×</button>
            <div class="detail-domain">
              <span id="detailSwatch"></span>
              <span id="detailDomain"></span>
            </div>
            <h2 id="detailName">选择一个数据表</h2>
            <code id="detailEnglish">—</code>
            <div class="status-group">
              <span id="detailOnline" class="status-badge"></span>
              <span id="detailLake" class="status-badge"></span>
            </div>
            <dl>
              <div><dt>主题域</dt><dd id="detailL2">—</dd></div>
              <div><dt>业务对象</dt><dd id="detailL3">—</dd></div>
              <div><dt>模型负责人</dt><dd id="detailOwner">—</dd></div>
            </dl>
            <button id="relatedBtn" class="related-btn" type="button">查看同业务对象数据表 <span>→</span></button>
          </aside>

          <div id="emptyState" class="empty-state" hidden>
            <strong>没有找到匹配的数据表</strong>
            <span>试试更换关键词或筛选条件</span>
          </div>
        </section>
      </main>
    </div>

    <script src="./src/data.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
